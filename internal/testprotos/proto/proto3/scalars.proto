syntax = "proto3";

package cotorp.test.proto3;

import "common/common.proto";

option go_package = "github.com/canonical/cotorp/internal/testprotos/proto3;proto3pb";

// Scalars exercises every scalar type with implicit presence.
message Scalars {
  double f_double = 1;
  float f_float = 2;
  int64 f_int64 = 3;
  uint64 f_uint64 = 4;
  int32 f_int32 = 5;
  fixed64 f_fixed64 = 6;
  fixed32 f_fixed32 = 7;
  bool f_bool = 8;
  string f_string = 9;
  bytes f_bytes = 10;
  uint32 f_uint32 = 11;
  sfixed32 f_sfixed32 = 12;
  sfixed64 f_sfixed64 = 13;
  sint32 f_sint32 = 14;
  sint64 f_sint64 = 15;
  cotorp.test.common.Color f_enum = 16;
  Nested f_nested = 17;
  cotorp.test.common.Shared f_shared = 18;

  message Nested {
    int32 a = 1;
    Nested recursive = 2;
  }
}

message Optionals {
  optional double o_double = 1;
  optional float o_float = 2;
  optional int64 o_int64 = 3;
  optional uint64 o_uint64 = 4;
  optional int32 o_int32 = 5;
  optional fixed64 o_fixed64 = 6;
  optional fixed32 o_fixed32 = 7;
  optional bool o_bool = 8;
  optional string o_string = 9;
  optional bytes o_bytes = 10;
  optional uint32 o_uint32 = 11;
  optional sfixed32 o_sfixed32 = 12;
  optional sfixed64 o_sfixed64 = 13;
  optional sint32 o_sint32 = 14;
  optional sint64 o_sint64 = 15;
  optional cotorp.test.common.Color o_enum = 16;
}

message Repeateds {
  repeated double r_double = 1;
  repeated float r_float = 2;
  repeated int64 r_int64 = 3;
  repeated uint64 r_uint64 = 4;
  repeated int32 r_int32 = 5;
  repeated fixed64 r_fixed64 = 6;
  repeated fixed32 r_fixed32 = 7;
  repeated bool r_bool = 8;
  repeated string r_string = 9;
  repeated bytes r_bytes = 10;
  repeated uint32 r_uint32 = 11;
  repeated sfixed32 r_sfixed32 = 12;
  repeated sfixed64 r_sfixed64 = 13;
  repeated sint32 r_sint32 = 14;
  repeated sint64 r_sint64 = 15;
  repeated cotorp.test.common.Color r_enum = 16;
  repeated Scalars.Nested r_nested = 17;
  repeated int32 r_unpacked = 18 [packed = false];
}

message Maps {
  map<string, string> m_string_string = 1;
  map<int32, int64> m_int32_int64 = 2;
  map<bool, bytes> m_bool_bytes = 3;
  map<sint64, Scalars.Nested> m_sint64_nested = 4;
  map<fixed32, cotorp.test.common.Color> m_fixed32_enum = 5;
  map<uint64, double> m_uint64_double = 6;
  map<string, cotorp.test.common.Shared> m_string_shared = 7;
}

message Oneofs {
  oneof choice {
    int32 c_int32 = 1;
    string c_string = 2;
    bytes c_bytes = 3;
    Scalars.Nested c_nested = 4;
    cotorp.test.common.Color c_enum = 5;
    double c_double = 6;
  }
  int32 after = 7;
  oneof other {
    sint64 o_sint64 = 100;
    fixed32 o_fixed32 = 20000;
  }
}

// Names exercises field names that collide with generated methods.
message Names {
  int32 reset = 1;
  int32 proto_size = 2;
  int32 get_foo = 3;
  int32 foo = 4;
  string marshal_binary = 5;
}
