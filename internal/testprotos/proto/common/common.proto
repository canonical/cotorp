syntax = "proto3";

package cotorp.test.common;

option go_package = "github.com/canonical/cotorp/internal/testprotos/common;commonpb";

// Shared is a message referenced from other packages.
message Shared {
  string label = 1;
  int64 value = 2;
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
  COLOR_BLUE = 3;
}
